services:
  youziloadlab:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: dev-secret-key-dev-secret-key-32
      ADMIN_PASSWORD: dev-admin-password
      DATABASE_URL: sqlite:////data/youziloadlab.db
      DATA_DIR: /data
      RUNNER_WORKDIR: /data/runs
    volumes:
      - ./data:/data
